# ==============================================================================
# BeaconPort Nginx Reverse Proxy Configuration
#
# Production Architecture:
# - Reverse proxies incoming web traffic to Node.js API container (127.0.0.1:5000)
# - Forwards proxy headers (X-Forwarded-For, X-Forwarded-Proto, X-Request-ID)
# - Enforces client body limits (10M for formidable file uploads)
# - Supplies defense-in-depth security headers
# - Accommodates AWS CloudFront SSL termination (Option A) and Certbot (Option B)
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured JSON-friendly access log format with tracing ID
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                    'req_id="$http_x_request_id"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Suppress Nginx version disclosure

    # Gzip compression for text payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Request body size limit (matches Formidable 5MB upload + form field buffer)
    client_max_body_size 10M;

    # Upstream definition for Node.js Express Container
    upstream beaconport_api {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP Server (Port 80)
    #
    # In Option A (CloudFront):
    #   CloudFront terminates HTTPS at the edge and forwards HTTP traffic to
    #   port 80. Nginx detects CloudFront's 'X-Forwarded-Proto: https' header.
    #
    # In Option B (Certbot / Direct Domain):
    #   ACME challenge path /.well-known/acme-challenge/ is served locally.
    #   All other traffic is redirected permanently (301) to HTTPS port 443.
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME challenge location for Certbot Let's Encrypt automated verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Uptime / Liveness Probe (bypasses heavy logging)
        location = /health {
            proxy_pass http://beaconport_api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # Readiness Probe
        location = /ready {
            proxy_pass http://beaconport_api/ready;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # Main reverse proxy location
        location / {
            # Pass to Express 5 backend
            proxy_pass http://beaconport_api;
            proxy_http_version 1.1;

            # Reverse proxy headers
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Forward original client protocol (handles CloudFront HTTPS offloading)
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # Request ID tracing: pass existing header or assign Nginx internal ID
            proxy_set_header X-Request-ID $http_x_request_id;

            # Upstream timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Security response headers (defense-in-depth)
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Server (Port 443) - Option B (Direct Domain with Certbot)
    #
    # Uncomment and populate when using a direct custom domain with Let's Encrypt.
    # Not required when using AWS CloudFront (Option A), as CloudFront terminates
    # SSL/TLS at the global edge.
    # --------------------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name api.yourdomain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    #
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     # Strict Transport Security (HSTS)
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Frame-Options "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-XSS-Protection "1; mode=block" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #
    #     location = /health {
    #         proxy_pass http://beaconport_api/health;
    #         access_log off;
    #     }
    #
    #     location / {
    #         proxy_pass http://beaconport_api;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_set_header X-Request-ID $http_x_request_id;
    #     }
    # }
}

