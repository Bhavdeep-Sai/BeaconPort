services:
  api:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: beaconport-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/beaconport
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_key_at_least_32_characters_long}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - ENABLE_IN_PROCESS_CRON=${ENABLE_IN_PROCESS_CRON:-false}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - beaconport-network

  mongodb:
    image: mongo:7.0
    container_name: beaconport-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=beaconport
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - beaconport-network

networks:
  beaconport-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
