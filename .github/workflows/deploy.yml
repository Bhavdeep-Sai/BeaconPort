name: CD Deploy Pipeline

# ==============================================================================
# Production Continuous Deployment Pipeline: Amazon ECR + AWS SSM (Zero SSH)
#
# Authentication: GitHub OpenID Connect (OIDC) - No static AWS access keys
# Deployment: AWS Systems Manager (SSM) Run Command - Port 22 is closed
#
# Required GitHub Repository Variables (Settings -> Secrets & Variables -> Actions):
#   - AWS_REGION: Target AWS Region (e.g. us-east-1)
#   - ECR_REPOSITORY: Amazon ECR Repository Name (e.g. beaconport-api)
#
# Required GitHub Secrets:
#   - AWS_ROLE_ARN: IAM Role ARN configured with GitHub OIDC Trust Policy
#                   (e.g. arn:aws:iam::123456789012:role/BeaconPortGitHubOIDCRole)
#   - EC2_INSTANCE_ID: Target EC2 Instance ID (e.g. i-0123456789abcdef0)
# ==============================================================================

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"

permissions:
  id-token: write  # Crucial for OIDC token minting
  contents: read

jobs:
  deploy:
    name: Build, Push to ECR & Deploy via SSM
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (via GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: BeaconPortDeploySession
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Metadata
        id: meta
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPOSITORY="${{ vars.ECR_REPOSITORY || 'beaconport-api' }}"
          IMAGE_URI="$REGISTRY/$REPOSITORY"
          COMMIT_TAG="${{ github.sha }}"
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "commit_tag=$COMMIT_TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./Server
          file: ./Server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.commit_tag }}
            ${{ steps.meta.outputs.image_uri }}:latest

      - name: Execute Zero-SSH Deployment via AWS SSM Run Command
        run: |
          IMAGE_TAG="${{ steps.meta.outputs.commit_tag }}"
          IMAGE_URI="${{ steps.meta.outputs.image_uri }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

          if [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: EC2_INSTANCE_ID secret is not configured. Aborting deployment."
            exit 1
          fi

          echo "Triggering SSM Run Command on EC2 Instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy BeaconPort API commit $IMAGE_TAG" \
            --parameters commands="[
              \"echo 'Logging in to ECR on EC2...'\",
              \"aws ecr get-login-password --region ${{ vars.AWS_REGION || 'us-east-1' }} | docker login --username AWS --password-stdin $IMAGE_URI\",
              \"echo 'Pulling updated image: $IMAGE_URI:$IMAGE_TAG...'\",
              \"docker pull $IMAGE_URI:$IMAGE_TAG\",
              \"echo 'Restarting BeaconPort API container...'\",
              \"docker stop beaconport-api || true\",
              \"docker rm beaconport-api || true\",
              \"docker run -d --name beaconport-api --restart unless-stopped -p 5000:5000 --env-file /etc/beaconport/.env $IMAGE_URI:$IMAGE_TAG\",
              \"echo 'Verifying container health on /health...'\",
              \"sleep 5\",
              \"curl --fail --retry 5 --retry-delay 3 http://localhost:5000/health || exit 1\",
              \"echo 'Deployment successful!'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Dispatched SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment execution..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "SSM Command Execution Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi

          echo "Deployment verified and completed successfully!"
