version: 2
updates:
  # Maintain Server npm dependencies (grouped into a single PR)
  - package-ecosystem: "npm"
    directory: "/Server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    groups:
      server-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps-server)"

  # Maintain Client npm dependencies (grouped into a single PR)
  - package-ecosystem: "npm"
    directory: "/Client"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    groups:
      client-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps-client)"

  # Maintain GitHub Actions dependencies (grouped into a single PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    groups:
      action-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps-actions)"
